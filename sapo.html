<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sapos Saltitantes - HTML5</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐸</text></svg>">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a2a3a;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 10px;
            color: white;
        }

        h1 { margin-top: 0; margin-bottom: 10px; text-align: center; }

        .instructions {
            background: linear-gradient(to right, #2ecc71, #27ae60);
            color: white;
            padding: 15px 20px;
            border-radius: 15px;
            text-align: center;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-size: 15px;
        }

        /* Layout Flexível */
        .main-layout {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 1100px;
        }

        /* Wrapper Responsivo do Jogo */
        #board-wrapper {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        #game-board {
            position: relative;
            width: 800px;
            height: 300px;
            background: linear-gradient(to bottom, #112233 0%, #204060 50%, #2980b9 50%, #3498db 100%);
            border: 5px solid #bdc3c7;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
            transform-origin: top left;
        }

        .rock {
            position: absolute; bottom: 50px; width: 80px; height: 40px; background-color: #7f8c8d; border-radius: 50%; box-shadow: inset -5px -10px 10px rgba(0,0,0,0.3);
        }

        .frog {
            position: absolute; bottom: 75px; width: 70px; height: 70px; cursor: pointer; z-index: 10; transition: left 0.5s ease-in-out; 
        }

        @keyframes jump-arc {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-60px) scale(1.1); z-index: 20; }
            100% { transform: translateY(0) scale(1); }
        }

        .jumping { animation: jump-arc 0.5s ease-in-out; }
        .frog:hover { filter: brightness(1.2); }

        /* Painel de Status */
        #status-panel {
            width: 100%;
            max-width: 200px;
            height: 300px;
            background-color: #ecf0f1;
            color: #333;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            text-align: center;
        }

        /* Expande o painel e encurta a altura em celulares */
        @media (max-width: 850px) {
            #status-panel { max-width: 100%; height: 150px; }
            .moves-box { padding: 10px !important; }
        }

        #status-panel h3 { background-color: #2c3e50; color: white; margin: 0; padding: 15px; border-radius: 10px 10px 0 0; font-size: 16px; }
        .moves-box { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        .moves-count { font-size: 42px; font-weight: bold; color: #2980b9; }

        .controls { margin-top: 20px; display: flex; justify-content: center; width: 100%; }
        button { padding: 12px 30px; font-size: 18px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; transition: 0.2s; color: white; background-color: #e74c3c; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        button:hover { background-color: #c0392b; transform: scale(1.05); }

        #modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); z-index: 100; display: none; justify-content: center; align-items: center; }
        #modal-box { background-color: white; padding: 30px; border-radius: 15px; text-align: center; max-width: 90%; box-sizing: border-box; }
        #modal-title { margin-top: 0; font-size: 24px; }
        #modal-desc { color: #333; font-size: 16px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h1>Sapos Saltitantes</h1>
    <div class="instructions">
        <strong>Objetivo:</strong> Verdes para a direita, marrons para a esquerda.<br>
        <strong>Regras:</strong> Deslize ou pule 1 sapo. Não andam para trás. Clique para mover!
    </div>

    <div class="main-layout">
        <div id="board-wrapper">
            <div id="game-board">
                <div id="rocks-container"></div>
                <div id="frogs-container"></div>
                <div id="modal-overlay">
                    <div id="modal-box">
                        <h2 id="modal-title"></h2>
                        <p id="modal-desc"></p>
                        <button onclick="resetGame()">🔄 Reiniciar</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="status-panel">
            <h3>Movimentos</h3>
            <div class="moves-box">
                <div class="moves-count" id="moves-counter">0</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button onclick="resetGame()">🔄 Reiniciar Jogo</button>
    </div>

    <script>
        const svgFrogGreen = `<svg width="70" height="70" viewBox="0 0 100 100"><ellipse cx="50" cy="65" rx="35" ry="25" fill="#2ecc71" stroke="#27ae60" stroke-width="3"/><ellipse cx="30" cy="40" rx="15" ry="15" fill="#2ecc71" stroke="#27ae60" stroke-width="3"/><ellipse cx="70" cy="40" rx="15" ry="15" fill="#2ecc71" stroke="#27ae60" stroke-width="3"/><circle cx="30" cy="35" r="5" fill="white"/><circle cx="30" cy="35" r="2" fill="black"/><circle cx="70" cy="35" r="5" fill="white"/><circle cx="70" cy="35" r="2" fill="black"/><path d="M 35 75 Q 50 85 65 75" stroke="#27ae60" stroke-width="3" fill="transparent"/><path d="M 20 80 Q 10 90 20 100" stroke="#2ecc71" stroke-width="5" fill="transparent"/><path d="M 80 80 Q 90 90 80 100" stroke="#2ecc71" stroke-width="5" fill="transparent"/></svg>`;
        const svgFrogBrown = `<svg width="70" height="70" viewBox="0 0 100 100"><ellipse cx="50" cy="65" rx="35" ry="25" fill="#d35400" stroke="#a04000" stroke-width="3"/><ellipse cx="30" cy="40" rx="15" ry="15" fill="#d35400" stroke="#a04000" stroke-width="3"/><ellipse cx="70" cy="40" rx="15" ry="15" fill="#d35400" stroke="#a04000" stroke-width="3"/><circle cx="30" cy="35" r="5" fill="white"/><circle cx="30" cy="35" r="2" fill="black"/><circle cx="70" cy="35" r="5" fill="white"/><circle cx="70" cy="35" r="2" fill="black"/><path d="M 35 75 Q 50 85 65 75" stroke="#a04000" stroke-width="3" fill="transparent"/><path d="M 20 80 Q 10 90 20 100" stroke="#d35400" stroke-width="5" fill="transparent"/><path d="M 80 80 Q 90 90 80 100" stroke="#d35400" stroke-width="5" fill="transparent"/></svg>`;

        let state = []; 
        let frogs = []; 
        let moves = 0;
        let isAnimating = false;
        let gameOver = false;
        const slotX = [40, 140, 240, 340, 440, 540, 640];

        // Função de Escala Responsiva
        function adjustScale() {
            const wrapper = document.getElementById('board-wrapper');
            const board = document.getElementById('game-board');
            const scale = Math.min(1, wrapper.clientWidth / 800);
            board.style.transform = `scale(${scale})`;
            wrapper.style.height = (300 * scale) + 'px';
        }

        window.addEventListener('resize', adjustScale);

        function resetGame() {
            document.getElementById('modal-overlay').style.display = 'none';
            const rocksContainer = document.getElementById('rocks-container');
            const frogsContainer = document.getElementById('frogs-container');
            
            rocksContainer.innerHTML = '';
            frogsContainer.innerHTML = '';
            
            state = ['G', 'G', 'G', null, 'B', 'B', 'B'];
            frogs = [];
            moves = 0;
            isAnimating = false;
            gameOver = false;
            document.getElementById('moves-counter').innerText = moves;

            for(let i = 0; i < 7; i++) {
                let rock = document.createElement('div');
                rock.className = 'rock';
                rock.style.left = (slotX[i] - 5) + 'px'; 
                rocksContainer.appendChild(rock);

                if (state[i] !== null) {
                    let type = state[i];
                    let frogId = 'frog_' + i;
                    let frogEl = document.createElement('div');
                    frogEl.className = 'frog';
                    frogEl.id = frogId;
                    frogEl.innerHTML = type === 'G' ? svgFrogGreen : svgFrogBrown;
                    frogEl.style.left = slotX[i] + 'px';
                    
                    frogs.push({ id: frogId, type: type, pos: i });
                    frogEl.onclick = () => handleFrogClick(frogId);
                    frogsContainer.appendChild(frogEl);
                }
            }
            adjustScale(); // Ajusta a escala inicial
        }

        function handleFrogClick(id) {
            if (isAnimating || gameOver) return;
            const frog = frogs.find(f => f.id === id);
            const pos = frog.pos;
            const dir = frog.type === 'G' ? 1 : -1; 
            let targetPos = -1;

            if (state[pos + dir] === null) targetPos = pos + dir;
            else if (state[pos + dir] !== undefined && state[pos + dir * 2] === null) targetPos = pos + dir * 2;

            if (targetPos !== -1) moveFrog(frog, targetPos);
        }

        function moveFrog(frog, targetPos) {
            isAnimating = true;
            moves++;
            document.getElementById('moves-counter').innerText = moves;

            const frogEl = document.getElementById(frog.id);
            frogEl.style.left = slotX[targetPos] + 'px';
            frogEl.classList.add('jumping'); 

            state[frog.pos] = null;
            state[targetPos] = frog.type;
            frog.pos = targetPos;

            setTimeout(() => {
                frogEl.classList.remove('jumping');
                isAnimating = false;
                checkGameState();
            }, 500);
        }

        function checkGameState() {
            if (state.join(',') === 'B,B,B,,G,G,G') {
                showModal("VOCÊ VENCEU! 🎉", `Resolvido em ${moves} movimentos!`, "#2ecc71");
                return;
            }

            let hasValidMoves = false;
            for (let i = 0; i < frogs.length; i++) {
                let f = frogs[i];
                let dir = f.type === 'G' ? 1 : -1;
                if (state[f.pos + dir] === null || (state[f.pos + dir] !== undefined && state[f.pos + dir * 2] === null)) {
                    hasValidMoves = true;
                    break;
                }
            }

            if (!hasValidMoves) showModal("GAME OVER! ☠️", "Eles estão presos!", "#e74c3c");
        }

        function showModal(title, desc, color) {
            gameOver = true;
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-title').style.color = color;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        window.onload = resetGame;
    </script>
</body>
</html>
